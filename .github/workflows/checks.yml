name: Checks

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv run --locked --extra dev pytest -q
      - run: uv run --locked --extra dev python scripts/run_hotpot_eval.py --reranker lexical --output /tmp/vector.csv
      - run: uv run --locked --extra dev python scripts/run_hotpot_eval.py --graph cooccurrence --reranker lexical --output /tmp/graph.csv
